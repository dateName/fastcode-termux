name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps & build bundle
        working-directory: package
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build release artifacts (portable tar.gz/zip + npm pack + sha256)
        run: sh scripts/build-portable.sh

      - name: List artifacts
        run: ls -lh release

      - name: Publish GitHub Release
        # Only on a v* tag push; a manual "Run workflow" from a branch has no tag.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/fastcode-portable-*.tar.gz
            release/fastcode-portable-*.zip
            release/datename-fastcode-termux-*.tgz
            release/SHA256SUMS
          generate_release_notes: true

      # Publishes to npm on a v* tag OR a manual run (any ref) when the
      # NPM_TOKEN secret is set. Keeps `npm install -g` from serving a stale build.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
