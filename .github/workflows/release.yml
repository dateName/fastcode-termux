name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install deps & build bundle
        working-directory: package
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build release artifacts (portable tar.gz/zip + npm pack + sha256)
        run: sh scripts/build-portable.sh

      - name: List artifacts
        run: ls -lh release

      - name: Publish GitHub Release
        # Only on a v* tag push; a manual "Run workflow" from a branch has no tag.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/fastcode-portable-*.tar.gz
            release/fastcode-portable-*.zip
            release/datename-fastcode-termux-*.tgz
            release/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}

      # Publishes to npm on a v* tag OR a manual run.
      #  - Preferred: Trusted Publishing (OIDC) — no long-lived secret. Configure the
      #    package on npmjs.com → Settings → Trusted Publishing with this repo+workflow,
      #    then delete the NPM_TOKEN secret.
      #  - Fallback: if NPM_TOKEN is set, it is used instead.
      - name: Publish to npm
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN set - using npm Trusted Publishing (OIDC)."
            npm config delete //registry.npmjs.org/:_authToken || true
          fi
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=beta ;; esac
          npm publish --access public --tag "$TAG"
